### Access Rights (typed)
# Needs fixing!
#
# On the ODISSEI portal we do not have the files and no file metadata either
# but if we count the number of restricted files, 
# if it is 0 we can say the dataset is public, otherwise restricted ?
# But for sake of testing make it public, 
# the portal itself (only metadata) is public, so someway we can argue this ?
nodes.ar.kind                            = iri
nodes.ar.type                            = dct:RightsStatement
nodes.ar.iri.const                        = http://publications.europa.eu/resource/authority/access-right/PUBLIC
props.accessRights.predicate             = dct:accessRights
props.accessRights.as                    = node-ref
props.accessRights.node                  = ar

# Add the license
# Do we always have that with an uri?
props.license.predicate = dct:license
props.license.as        = iri
props.license.iri.json                    = $.datasetJson.datasetVersion.license.uri

### Theme (typed)
# Needs fixing!
#
# For now we can make it fixed to Social Sciences. which is fine for the ODISSEI portal
# for others repos we would like to map from subjects, but that is not straightforward, as we do not have a real subject scheme in the metadata, and the subjects are just keywords without a scheme.
#
nodes.theme.kind      = iri
nodes.theme.type      = skos:Concept
nodes.theme.iri.const = http://publications.europa.eu/resource/authority/data-theme/SOCI
nodes.theme.props.prefLabel.predicate = skos:prefLabel
nodes.theme.props.prefLabel.as        = literal
nodes.theme.props.prefLabel.lang      = en
nodes.theme.props.prefLabel.const     = Social Sciences
props.theme.predicate = dcat:theme
props.theme.as        = node-ref
props.theme.node      = theme


### Keywords
# NOT MANDATORY, but nice to have, and we can get it from the dataset metadata
props.keyword_en.predicate               = dcat:keyword
props.keyword_en.as                      = literal
#props.keyword_en.lang                    = en
props.keyword_en.multi                   = true
props.keyword_en.json                    = $..metadataBlocks.citation.fields[?(@.typeName=='keyword')].value[*].keywordValue.value

