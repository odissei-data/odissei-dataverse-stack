################################################################################
# DCAT Dataset Mapping (DCAT-AP-NL 3.0 compliant)
################################################################################

### Subject IRI
subject.iri.json                         = $.datasetJson.persistentUrl

# NOTE that we do not know the language of most metadata fields

### Title
# Mandatory
props.title_en.predicate                 = dct:title
props.title_en.as                        = literal
props.title_en.json                      = $..metadataBlocks.citation.fields[?(@.typeName=='title')].value

### Description
# Mandatory
props.description_en.predicate           = dct:description
props.description_en.as                  = literal
props.description_en.json                = $..metadataBlocks.citation.fields[?(@.typeName=='dsDescription')].value[*].dsDescriptionValue.value

### Identifier
# Mandatory
props.identifier.predicate               = dct:identifier
props.identifier.as                      = literal
props.identifier.json                    = $.datasetJson.datasetVersion.datasetPersistentId

### Landing page & page (use persistent URL) ? TNO Has foaf:Document
# Note that the URL is used as dataset iri, so we cannot reuse it here
# we can use the landingpage that is specific for this repository, NOT the PID but using it as parameter
# Recommended
props.landing.json                       = $.datasetJson.datasetVersion.datasetPersistentId
props.landing.format                     = http://localhost:8080/datasets.xhtml&persistentId=${value}
props.landing.predicate                  = dcat:landingPage
props.landing.as                         = iri


### ConformsTo
# Recommended
nodes.std.kind                           = bnode
nodes.std.type                           = dct:Standard
nodes.std.props.title.predicate          = dct:title
nodes.std.props.title.as                 = literal
nodes.std.props.title.lang               = en
nodes.std.props.title.const              = DCAT-AP-NL 3.0 data publication profile
props.conformsTo.predicate               = dct:conformsTo
props.conformsTo.as                      = node-ref
props.conformsTo.node                    = std

### Access Rights (typed)
# Mandatory
#
# On the ODISSEI portal we do not have the files and no file metadata either
# the portal itself (only metadata) is public
props.accessRights.predicate             = dct:accessRights
props.accessRights.const                 = http://publications.europa.eu/resource/authority/access-right/PUBLIC
props.accessRights.as                    = iri

# Add the license
# Do we always have that with an uri?
props.license.predicate               = dct:license
props.license.as                      = iri
props.license.json                    = $.datasetJson.datasetVersion.license.uri

### Theme 
# Mandatory
#
# For now we can make it fixed to Social Sciences. which is fine for the ODISSEI portal
# for others repos we would like to map from subjects, but that is not straightforward, as we do not have a real 
# subject scheme in the metadata, and the subjects are just keywords without a scheme.
props.theme.predicate                   = dcat:theme
props.theme.const                       = http://publications.europa.eu/resource/authority/data-theme/SOCI
props.theme.as                          = iri

# Include "Keyword Getty AAT" and "Keyword ELSST" values' URIs in the dcat:theme property
props.theme_aat.predicate               = dcat:theme
props.theme_aat.as                      = iri
props.theme_aat.multi                   = true
props.theme_aat.json                    = $..metadataBlocks.dansSocialSciences.fields[?(@.typeName=='dansAATClassification')].value[*]
props.theme_elsst.predicate             = dcat:theme
props.theme_elsst.as                    = iri
props.theme_elsst.multi                 = true
props.theme_elsst.json                  = $..metadataBlocks.dansSocialSciences.fields[?(@.typeName=='dansElsstClassification')].value[*]


### Keywords
# Recommended
props.keyword_en.predicate               = dcat:keyword
props.keyword_en.as                      = literal
props.keyword_en.multi                   = true
props.keyword_en.json                    = $..metadataBlocks.citation.fields[?(@.typeName=='keyword')].value[*].keywordValue.value

# DANS is publishing the datasets?
# Or do we get this from the dataset metadata


### Contact Point (vCard)
# ODISSEI, fixed contact point
nodes.contact.kind      = iri
nodes.contact.iri.const = https://odissei-data.nl/#contact
nodes.contact.type                  = vcard:Kind
nodes.contact.props.fn_en.predicate = vcard:fn
nodes.contact.props.fn_en.as        = literal
nodes.contact.props.fn_en.lang      = en
nodes.contact.props.fn_en.const     = Open Data Infrastructure for Social Science and Economic Innovations
nodes.contact.props.email.predicate = vcard:hasEmail
nodes.contact.props.email.as        = iri
nodes.contact.props.email.const     = mailto:portal@odissei.nl
nodes.contact.props.url.predicate   = vcard:hasURL
nodes.contact.props.url.as          = iri
nodes.contact.props.url.const       = https://odissei-data.nl/
nodes.contact.props.organization-name.predicate = vcard:organization-name
nodes.contact.props.organization-name.as        = literal
nodes.contact.props.organization-name.lang      = en
nodes.contact.props.organization-name.const     = ODISSEI
nodes.contact.props.identifier.predicate = dct:identifier
nodes.contact.props.identifier.as        = iri
nodes.contact.props.identifier.const     = https://ror.org/03m8v6t10
props.contactPoint.predicate        = dcat:contactPoint
props.contactPoint.as               = node-ref
props.contactPoint.node             = contact
 

### Publisher 
# Mandatory
# DANS, we can use the ror id here https://ror.org/008pnp284
#
# But on ODISSEI portal we might want the publisher from where it is harvested?
#
# For ODISSEI, for now fixed to the portal; so not the organisation of the source
nodes.publisher.kind      = bnode
nodes.publisher.type      = foaf:Agent
nodes.publisher.props.name_en.predicate = foaf:name
nodes.publisher.props.name_en.as        = literal
nodes.publisher.props.name_en.const     = ODISSEI Portal
props.publisher.predicate = dct:publisher
props.publisher.as        = node-ref
props.publisher.node      = publisher


### Creators 
# Not in this properties file;
# we use the properties dcat-dataset-creator.properties for that
# because we need to iterate over the creators and create a node for each, and that is not possible in this file, 
# as it is only for dataset level properties, not for iterating over arrays of metadata values.

# ---- Optional


# Version, should be important since it is used in citation, but is optional in DCAT-AP-NL
props.version.predicate = dct:version
props.version.as        = literal
props.version.json.1    = $.datasetJson.datasetVersion.versionNumber
props.version.json.2    = $.datasetJson.datasetVersion.versionMinorNumber
props.version.format    = V${1}.${2}

# Issued typed as xsd:date (YYYY-MM-DD)
props.issued.predicate  = dct:issued
props.issued.as         = literal
props.issued.datatype   = xsd:date
props.issued.json       = $.datasetJson.datasetVersion.publicationDate

# Modified: keep full ISO instant and type as xsd:dateTime (matches lexical '2024-03-20T14:02:13Z')
props.modified.predicate = dct:modified
props.modified.as        = literal
props.modified.datatype  = xsd:dateTime
props.modified.json      = $.datasetJson.datasetVersion.lastUpdateTime
# props.modified.transform = iso-date-only   # REMOVED to keep time component
