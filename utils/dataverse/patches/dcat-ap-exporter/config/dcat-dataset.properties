# ODISSEI, fixed contact point

### Contact Point (vCard)
nodes.contact.kind                  = bnode
nodes.contact.type                  = vcard:Kind
nodes.contact.props.fn_en.predicate = vcard:fn
nodes.contact.props.fn_en.as        = literal
nodes.contact.props.fn_en.lang      = en
nodes.contact.props.fn_en.const     = Open Data Infrastructure for Social Science and Economic Innovations
nodes.contact.props.email.predicate = vcard:hasEmail
nodes.contact.props.email.as        = iri
nodes.contact.props.email.const     = mailto:portal@odissei.nl
nodes.contact.props.url.predicate   = vcard:hasURL
nodes.contact.props.url.as          = iri
nodes.contact.props.url.const       = https://odissei-data.nl/
nodes.contact.props.organization-name.predicate = vcard:organization-name
nodes.contact.props.organization-name.as        = literal
nodes.contact.props.organization-name.lang      = en
nodes.contact.props.organization-name.const     = ODISSEI
nodes.contact.props.identifier.predicate = dct:identifier
nodes.contact.props.identifier.as        = iri
nodes.contact.props.identifier.const     = https://ror.org/03m8v6t10
props.contactPoint.predicate        = dcat:contactPoint
props.contactPoint.as               = node-ref
props.contactPoint.node             = contact
 

