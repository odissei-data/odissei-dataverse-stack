################################################################################
# DCAT Root Configuration
# Purpose: Defines global prefixes, element mappings, and relations for DCAT export
################################################################################

### Global Behavior
# Note: enable trace in development mode or when debugging
dcat.trace.enabled = false

# Only rdfXml can be harvestable. There is no exporter for turtle and jsonLd -> harvestable ignored for both properties
# Note that harvesting can be disabled on the portal, 
# so even if the format is harvestable, the OAI endpoint might not be available.
dcat.format.turtle.availableToUsers = true;
dcat.format.turtle.harvestable = false;
dcat.format.rdfXml.availableToUsers = true;
dcat.format.rdfXml.harvestable = true;
dcat.format.jsonLd.availableToUsers = true;
dcat.format.jsonLd.harvestable = false;

### Prefixes
prefix.dcat   = http://www.w3.org/ns/dcat#
prefix.dct    = http://purl.org/dc/terms/
prefix.foaf   = http://xmlns.com/foaf/0.1/
prefix.vcard  = http://www.w3.org/2006/vcard/ns#
prefix.skos   = http://www.w3.org/2004/02/skos/core#
prefix.rdfs   = http://www.w3.org/2000/01/rdf-schema#
prefix.xsd    = http://www.w3.org/2001/XMLSchema#
prefix.eli    = http://data.europa.eu/eli/ontology#
prefix.dcatap = http://data.europa.eu/r5r/
prefix.spdx   = http://spdx.org/rdf/terms#
prefix.rdf    = http://www.w3.org/1999/02/22-rdf-syntax-ns#
prefix.owl    = http://www.w3.org/2002/07/owl#
prefix.locn   = http://www.w3.org/ns/locn#
prefix.geo    = http://www.opengis.net/ont/geosparql#

### Elements to Build
element.catalog.id        = catalog
element.catalog.type      = dcat:Catalog
element.catalog.file      = dcat-catalog.properties

element.dataset.id        = dataset
element.dataset.type      = dcat:Dataset
element.dataset.file      = dcat-dataset.properties

# Dataset Distributions (file), but ODISSEI portal does not have them
# element.distribution.id   = distribution
# element.distribution.type = dcat:Distribution
# element.distribution.file = dcat-distribution.properties

# Services
# DISABLE for now
# element.dataservice.id    = dataservice
# element.dataservice.type  = dcat:DataService
# element.dataservice.file  = dcat-dataservice.properties

# Dataset Creators
element.datasetCreator.id   = datasetCreator
element.datasetCreator.type = foaf:Agent
element.datasetCreator.file = dcat-dataset-creator.properties

### Relations
relation.catalog_has_dataset.subject   = catalog
relation.catalog_has_dataset.predicate = dcat:dataset
relation.catalog_has_dataset.object    = dataset


# Dataset Distributions (file), but ODISSEI portal does not have them
# relation.dataset_has_distribution.subject   = dataset
# relation.dataset_has_distribution.predicate = dcat:distribution
# relation.dataset_has_distribution.object    = distribution

# Services
# DISABLE for now
# relation.dataset_has_service.subject   = dataset
# relation.dataset_has_service.predicate = dcat:service
# relation.dataset_has_service.object    = dataservice

# Dataset Creators
relation.dataset_has_creator.subject   = dataset
relation.dataset_has_creator.predicate = dcat:creator
relation.dataset_has_creator.object    = datasetCreator